name: publish

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MAVEN_REPOSITORY: ${{ github.event.release.prerelease && 'Snapshots' || 'Releases' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Check release tag matches project version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match project version '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: ./gradlew build

  maven:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish to ${{ env.MAVEN_REPOSITORY }}
        env:
          MYTHICISLAND_USERNAME: ${{ secrets.MYTHICISLAND_USERNAME }}
          MYTHICISLAND_PASSWORD: ${{ secrets.MYTHICISLAND_PASSWORD }}
        run: ./gradlew publishAllPublicationsTo${MAVEN_REPOSITORY}Repository

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build jars
        run: ./gradlew shadowJar sourcesJar

      - name: Upload jars to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release upload "$TAG" \
            "build/libs/spark-minestom-$VERSION.jar" \
            "build/libs/spark-minestom-$VERSION-sources.jar" \
            --clobber
